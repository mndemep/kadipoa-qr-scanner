
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadipoa QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 430px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    h2 { color: #166534; }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin: 18px 0;
      color: #555;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #0f766e;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>KADIPOA</h2>
    <p>Event QR Code Scanner</p>

    <button id="startButton" style="display:none;">OPEN CAMERA</button>

    <div id="reader"></div>

    <div id="status">Press OPEN CAMERA to start scanning.</div>
  </div>

  <script>
    
    let cameraStream = null;
    let videoElement = null;
    let detector = null;
    let scanning = false;
    let scanTimer = null;
    
    const button = document.getElementById("startButton");
    const status = document.getElementById("status");
    const reader = document.getElementById("reader");
    
    window.addEventListener("load", function() {
      startScanner();
    });
    
    async function startScanner() {
      try {
        if (!("BarcodeDetector" in window)) {
          status.textContent =
            "This browser does not support BarcodeDetector.";
          return;
        }
    
        const formats = await BarcodeDetector.getSupportedFormats();
    
        if (!formats.includes("qr_code")) {
          status.textContent = "QR Code format is not supported.";
          return;
        }
    
        detector = new BarcodeDetector({
          formats: ["qr_code"]
        });
    
        button.disabled = true;
        status.textContent = "Opening camera...";
    
        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
    
        videoElement = document.createElement("video");
        videoElement.setAttribute("playsinline", "");
        videoElement.muted = true;
        videoElement.autoplay = true;
        videoElement.srcObject = cameraStream;
    
        videoElement.style.width = "100%";
        videoElement.style.borderRadius = "10px";
    
        reader.innerHTML = "";
        reader.appendChild(videoElement);
    
        await videoElement.play();
    
        scanning = true;
        button.disabled = false;
        button.textContent = "SCANNING...";
        status.textContent = "Camera active. Point at a QR Code.";
    
        scanFrame();
    
      } catch (error) {
        status.textContent = "Camera error: " + error.message;
        button.disabled = false;
      }
    }
    
    async function scanFrame() {
      if (!scanning || !videoElement) return;
    
      try {
        const results = await detector.detect(videoElement);
    
       if (results.length > 0) {

        const rawValue = results[0].rawValue;
      
        let cardCode = "";
      
        try {
          cardCode = new URL(rawValue).searchParams.get("code") || "";
        } catch (error) {
          cardCode = rawValue.trim();
        }
      
        cardCode = cardCode.trim().toUpperCase();
      
        scanning = false;
        stopCamera();
      
        if (!cardCode) {
          status.textContent = "Invalid QR Code.";
          return;
        }
      
        if (window.opener && !window.opener.closed) {
      
          window.opener.postMessage(
            {
              type: "KADIPOA_QR_SCANNED",
              cardCode: cardCode
            },
            "*"
          );
      
          status.textContent = "Card verified. Returning to Kadipoa...";
      
          window.close();
      
        } else {
          status.textContent =
            "Kadipoa verification page is not available.";
        }
      
        return;
      }
    
      } catch (error) {
        console.error(error);
      }
    
      scanTimer = setTimeout(scanFrame, 150);
    }
    
    function stopCamera() {
      scanning = false;
    
      if (scanTimer) clearTimeout(scanTimer);
    
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

  </script>
</body>
</html>
