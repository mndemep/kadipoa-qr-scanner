
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadipoa QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 430px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    h2 { color: #166534; }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin: 18px 0;
      color: #555;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #0f766e;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>KADIPOA</h2>
    <p>Event QR Code Scanner</p>

    <button id="startButton">OPEN CAMERA</button>

    <div id="reader"></div>

    <div id="status">Press OPEN CAMERA to start scanning.</div>
  </div>

  <script>
    let scanner = null;
    let processing = false;

    document.getElementById("startButton")
      .addEventListener("click", startScanner);

    function startScanner() {
      const button = document.getElementById("startButton");
      const status = document.getElementById("status");

      button.disabled = true;
      status.textContent = "Opening camera...";

      scanner = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      });

      scanner.start(
        { facingMode: "environment" },
        {
          fps: 15,
          aspectRatio: 1.0
        },

        function(decodedText) {
          if (processing) return;
          processing = true;

          let cardCode = "";

          try {
            const qrUrl = new URL(decodedText);
            cardCode = qrUrl.searchParams.get("code") || "";
          } catch (error) {
            cardCode = decodedText.trim();
          }

          cardCode = cardCode.trim().toUpperCase();

          if (!cardCode) {
            processing = false;
            status.textContent = "Invalid QR Code. Scan again.";
            return;
          }

          scanner.stop().then(function() {
            status.textContent = "QR Code successfully scanned.";
            button.disabled = false;
            button.textContent = "SCAN ANOTHER CARD";

            const resultUrl = new URL(window.location.href);
            resultUrl.searchParams.set("code", cardCode);

            status.textContent = "Card Number: " + cardCode;

            const result = document.createElement("button");
            result.textContent = "CONTINUE TO VERIFICATION";
            result.style.marginTop = "15px";

            result.onclick = function() {
              window.location.href = resultUrl.toString();
            };

            document.querySelector(".container").appendChild(result);

          }).catch(function(error) {
            status.textContent = "Could not stop camera: " + error;
            button.disabled = false;
          });
        },

        function(errorMessage) {
          // Ignore continuous scanning errors.
        }

      ).then(function() {
        status.textContent = "Camera active. Point it at a QR Code.";
        button.disabled = false;

      }).catch(function(error) {
        status.textContent =
          "Unable to open camera. Check camera permission.";
        button.disabled = false;
        console.error(error);
      });
    }
  </script>
</body>
</html>
